name: macOS Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version and release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npm run version:check
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build packaged macOS download
        run: npm run package:macos-release

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTagger-macOS
          path: |
            release/MediaTagger-macOS-*.zip
            release/MediaTagger-macOS-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$(find release -maxdepth 1 -name 'MediaTagger-macOS-*.zip' -print -quit)"
          gh release create "${GITHUB_REF_NAME}" "$ASSET" "$ASSET.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MediaTagger ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Summarize installation
        shell: bash
        run: |
          {
            echo "## MediaTagger macOS package"
            echo
            echo "Download the MediaTagger-macOS zip, extract it, then right-click **Install MediaTagger.command** and choose **Open**."
            echo "The installer copies MediaTagger to Applications, applies an ad-hoc local signature, verifies it, and opens it."
            echo
            echo "This build is not Apple-notarized. The first right-click/Open is expected on a different Mac."
          } >> "$GITHUB_STEP_SUMMARY"
