name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - MAC

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build unsigned macOS app bundle
        run: npm run tauri:build:macos:unsigned

      - name: Package app bundle for download
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          if [[ -z "${APP_PATH:-}" ]]; then
            echo "No .app bundle found under src-tauri/target/release/bundle/macos"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "${APP_PATH}.zip"

      - name: Summarize unsigned macOS install steps
        shell: bash
        run: |
          {
            echo "## Unsigned macOS test build"
            echo
            echo "This workflow intentionally builds the unsigned \`.app\` bundle only, then zips it for download."
            echo
            echo "Do not rely on a DMG for unsigned CI testing. Use the zipped app bundle."
            echo
            echo "If macOS blocks launch on the test machine, run:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "MediaTagger.app"'
            echo 'open "MediaTagger.app"'
            echo '```'
            echo
            echo "If Finder still warns, right-click the app and choose **Open** once."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaTagger-macos-app
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error
