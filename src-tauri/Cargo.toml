[package]
name = "mediatagger"
version = "1.1.3"
description = "Local-first photo and video scanner, tagger, and organizer."
authors = ["MediaTagger"]
edition = "2021"

[lib]
name = "mediatagger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
exif = { package = "kamadak-exif", version = "0.6" }
dirs = "6"
sha2 = "0.10"
